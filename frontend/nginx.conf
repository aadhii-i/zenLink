server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the backend's SecurityHeadersMiddleware (core/security_headers.py)
    # so both services carry a consistent baseline.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite fingerprints build assets by content hash, so they're safe to
    # cache aggressively — a new deploy produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real static file resolves to
    # index.html so React Router's client-side routing works on a hard
    # refresh (e.g. /dashboard) instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
